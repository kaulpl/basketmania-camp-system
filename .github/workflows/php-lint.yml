name: PHP syntax lint

on:
  push:
    branches: ['main', 'release/**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev
      - name: Check PHP syntax
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l
      - name: Qualification card workflow and security tests
        run: php tests/release-112-qualification-test.php
      - name: Deposit and final payment regression tests
        run: php tests/deposit-payments-test.php
      - name: Deposit JavaScript syntax
        run: node --check assets/js/deposits.js
      - name: Qualification JavaScript syntax
        run: node --check assets/js/qualification.js
      - name: Upload qualification preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualification-1.12-preview
          path: /tmp/qualification-*
          if-no-files-found: ignore
      - name: Agreement renderer regression test
        run: php tests/agreement-renderer-051-test.php
      - name: Parent test autofill regression test
        run: php tests/parent-test-autofill-053-test.php
      - name: Check parent autofill JavaScript syntax
        run: node --check assets/js/parent-test-autofill-053.js
      - name: Agreement preview regression test
        run: php tests/agreement-preview-054-test.php
      - name: Agreement attachment page regression test
        run: php tests/agreement-attachment-page-055-test.php
      - name: Paid email button regression test
        run: php tests/paid-email-button-056-test.php
      - name: Release 0.57 regression test
        run: php tests/release-057-regression-test.php
      - name: Release 0.58 form verification regression test
        run: php tests/release-058-form-verification-test.php
      - name: Release 0.59 grouped card form behavior test
        run: php tests/release-059-card-form-test.php
      - name: Release 0.60 grouped card form behavior test
        run: php tests/release-060-card-form-test.php
      - name: Check card form JavaScript syntax
        run: node --check assets/js/card-form-060.js
      - name: Release 0.61 agreement send notification test
        run: php tests/release-061-agreement-send-notification-test.php
      - name: Check 0.61 agreement send JavaScript syntax
        run: node --check assets/js/agreement-send-061.js
      - name: Release 0.62 form editing and participant address test
        run: php tests/release-062-form-edit-address-test.php
      - name: Release 0.63 draft_sent form editing test
        run: php tests/release-063-draft-form-edit-test.php
      - name: Release 0.64 operational fixes test
        run: php tests/release-064-operations-test.php
      - name: Release 0.65 shirt size and logs test
        run: php tests/release-065-shirt-size-logs-test.php
      - name: Check 0.65 shirt size JavaScript syntax
        run: node --check assets/js/shirt-size-select-065.js
      - name: Release 0.66 agreement layout test
        run: php tests/release-066-agreement-layout-test.php
      - name: Release 0.67 repeated header and footer test
        run: php tests/release-067-repeated-header-footer-test.php
      - name: Release 0.68 agreement pagination test
        run: php tests/release-068-agreement-pagination-test.php
      - name: Release 0.69 print layout test
        run: php tests/release-069-print-layout-test.php
      - name: Release 0.70 agreement V2 structure test
        run: php tests/release-070-agreement-v2-test.php
      - name: Release 0.71 evidence layout test
        run: php tests/release-071-evidence-layout-test.php
      - name: Release 0.72 KSeF foundation test
        run: php tests/release-072-ksef-foundation-test.php
      - name: Release 0.73 Organizer view test
        run: php tests/release-073-organizer-view-test.php
      - name: Release 0.74 Organizer cleanup test
        run: php tests/release-074-organizer-cleanup-test.php
      - name: Release 0.75 KSeF operations test
        run: php tests/release-075-ksef-operations-test.php
      - name: Release 0.76 KSeF E2E test
        run: php tests/release-076-ksef-e2e-test.php
      - name: Release 0.77 KSeF parent delivery test
        run: php tests/release-077-ksef-parent-delivery-test.php
      - name: Release 0.78 organizer agreement proof test
        run: php tests/release-078-organizer-proof-test.php
      - name: Release 0.79 OTP AutoFill test
        run: php tests/release-079-otp-autofill-test.php
      - name: Release 0.80 invoice buyer/KSeF consistency test
        run: php tests/release-080-invoice-buyer-ksef-test.php
      - name: Release 0.81 form confirmation/date/KSeF help test
        run: php tests/release-081-form-confirmation-date-ksef-help-test.php
      - name: Release 0.82 KSeF buyer hard guard test
        run: php tests/release-082-ksef-buyer-hard-guard-test.php
      - name: Release 0.83 invoice profile/tab test
        run: php tests/release-083-invoice-profile-tab-test.php
      - name: Release 0.84 KSeF additional description test
        run: php tests/release-084-ksef-additional-description-test.php
      - name: Release 0.85 Chrome WebOTP test
        run: php tests/release-085-chrome-webotp-test.php
      - name: Check 0.85 WebOTP JavaScript syntax
        run: node --check assets/js/webotp-085.js
      - name: Release 0.86 parent status/invoice UI test
        run: php tests/release-086-parent-status-invoice-ui-test.php
      - name: Check 0.86 invoice profile JavaScript syntax
        run: node --check assets/js/invoice-profile-086.js
      - name: Release 0.87 native invoice accordion test
        run: php tests/release-087-native-invoice-accordion-test.php
      - name: Release 0.88 single KSeF description test
        run: php tests/release-088-single-ksef-description-test.php
      - name: Release 0.89 inbound mail parser/unread test
        run: php tests/release-089-inbound-mail-parser-unread-test.php
      - name: Release 0.90 mail reply modal test
        run: php tests/release-090-mail-reply-modal-test.php
      - name: Check 0.90 mail reply JavaScript syntax
        run: node --check assets/js/mail-reply-090.js
      - name: Release 0.95 bracket A3 layout and UTF-8 test
        env:
          BCS_TEST_BRACKET_PDF_PATH: /tmp/bracket-0.95-60.pdf
          BCS_TEST_BRACKET_SVG_PATH: /tmp/bracket-0.95-60.svg
        run: php tests/release-095-bracket-layout-utf8-test.php
      - name: Release 0.98 mailing system test
        run: php tests/release-098-mailing-system-test.php
      - name: Release 0.99 mailing deliverability test
        run: php tests/release-099-mailing-deliverability-test.php
      - name: Release 1.00 mailing UI dashboard and settings test
        run: php tests/release-100-mailing-ui-dashboard-settings-test.php
      - name: Release 1.02 mailing dashboard and date query test
        run: php tests/release-102-mailing-dashboard-stats-test.php
      - name: Release 1.03 pretty unsubscribe URL test
        run: php tests/release-103-pretty-unsubscribe-url-test.php
      - name: Check 1.00 mailing JavaScript syntax
        run: node --check assets/mailing-100.js
      - name: Upload 0.95 bracket preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bracket-0.95-60-preview
          path: |
            /tmp/bracket-0.95-60.pdf
            /tmp/bracket-0.95-60.svg
          if-no-files-found: ignore
      - name: Release 0.71 real Dompdf render
        env:
          BCS_TEST_PDF_PATH: /tmp/agreement-v2-0.71.pdf
          BCS_TEST_HTML_PATH: /tmp/agreement-v2-0.71.html
        run: php tests/release-070-dompdf-render-test.php
      - name: Upload agreement V2 preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agreement-v2-0.71-preview
          path: |
            /tmp/agreement-v2-0.71.pdf
            /tmp/agreement-v2-0.71.html
          if-no-files-found: ignore
